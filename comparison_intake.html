<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI比較実験入力</title><style>body{font:16px system-ui;background:#101827;color:#edf2ff;max-width:720px;margin:auto;padding:20px}textarea,input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:8px 0;border-radius:8px}textarea{min-height:130px}section{background:#202d43;padding:16px;margin:16px 0;border-radius:12px}button{background:#c6dbff;color:#14223a;border:0}label{display:block}</style><h1>AI比較実験入力</h1><p>同じプロンプトで取得した実際の回答だけを入力してください。入力は外部送信されません。</p><form id="f"><label>共通プロンプト<textarea id="prompt" required></textarea></label><div id="providers"></div><button type="submit">比較データを保存</button></form><p id="status" role="status"></p><script>
const names=['ChatGPT','Claude','Gemini']; const root=document.getElementById('providers'); for(const name of names){const s=document.createElement('section');s.innerHTML=`<h2>${name}</h2><label>モデル名<input id="${name}Model" placeholder="不明なら空欄"></label><label>実際の回答<textarea id="${name}Answer"></textarea></label>`;root.append(s)}
function build(prompt,responses){if(!prompt.trim())throw Error('プロンプトを入力してください');return {prompt,responses:responses.filter(r=>r.answer.trim())};}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();try{const data=build(document.getElementById('prompt').value,names.map(provider=>({provider,model:document.getElementById(provider+'Model').value,answer:document.getElementById(provider+'Answer').value})));const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='comparison_input.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent=`${data.responses.length}/3件を保存。未入力は未取得として扱います。`;}catch(e){document.getElementById('status').textContent=e.message}});
</script></html>

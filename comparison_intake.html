<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI比較実験入力</title><style>body{font:16px system-ui;max-width:720px;margin:auto;padding:20px}textarea,input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:8px 0}textarea{min-height:130px}section{border:1px solid #aaa;padding:16px;margin:16px 0;border-radius:12px}label{display:block}</style><h1>AI比較実験入力</h1><p>案件選択画面で保存したJSON、または途中保存したJSONを読み込めます。実際の回答のみ入力してください。データは端末内で処理します。</p><input type="file" id="import" accept=".json,.txt"><p id="status" role="status"></p><form id="f"><label>共通プロンプト<textarea id="prompt" required></textarea></label><button type="button" id="copy">プロンプトをコピー</button><div id="providers"></div><button type="submit">比較データを保存</button></form><script>
const names=['ChatGPT','Claude','Gemini'];const $=id=>document.getElementById(id);const links=['https://chatgpt.com/','https://claude.ai/','https://gemini.google.com/'];
for(const [i,name] of names.entries()){const s=document.createElement('section');s.innerHTML=`<h2>${name}</h2><a href="${links[i]}" target="_blank" rel="noopener noreferrer">${name}を開く</a><label>モデル名<input id="${name}Model" placeholder="不明なら空欄"></label><label>実際の回答<textarea id="${name}Answer"></textarea></label>`;$('providers').append(s)}
function validate(d){if(!d||typeof d.prompt!=='string'||!d.prompt.trim()||d.prompt.length>12000||!Array.isArray(d.responses)||d.responses.length>3)throw Error('不正な比較データ');const seen=new Set();for(const r of d.responses){if(!r||!names.includes(r.provider)||seen.has(r.provider)||typeof r.answer!=='string'||!r.answer.trim()||r.answer.length>100000||(r.model!=null&&typeof r.model!=='string'))throw Error('不正な回答');seen.add(r.provider)}return d}
function build(prompt,responses){return validate({prompt,responses:responses.filter(r=>r.answer.trim())})}
let version=0;$('import').onchange=async()=>{const v=++version;try{const f=$('import').files[0];if(!f||f.size>2000000)throw Error('ファイルが大きすぎます');const d=validate(JSON.parse(await f.text()));if(v!==version)return;if(($('prompt').value.trim()||names.some(n=>$(n+'Answer').value||$(n+'Model').value))&&!confirm('現在の入力を置き換えますか？'))return;$('prompt').value=d.prompt;for(const n of names){const r=d.responses.find(r=>r.provider===n);$(n+'Model').value=r?.model||'';$(n+'Answer').value=r?.answer||''}$('status').textContent=d.responses.length+'/3件を読み込みました'}catch(e){if(v===version)$('status').textContent=e.message}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').value);$('status').textContent='コピーしました'}catch(e){$('prompt').focus();$('prompt').select();$('status').textContent='選択した文章を手動でコピーしてください'}};
$('f').onsubmit=e=>{e.preventDefault();try{const d=build($('prompt').value,names.map(provider=>({provider,model:$(provider+'Model').value,answer:$(provider+'Answer').value})));const url=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='comparison_input.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent=d.responses.length+'/3件を保存しました'}catch(e){$('status').textContent=e.message}};
</script></html>

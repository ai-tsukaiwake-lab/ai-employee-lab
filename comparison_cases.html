<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>比較実験案件</title><style>body{font:16px system-ui;max-width:720px;margin:auto;padding:20px}textarea,select,button{font:inherit;max-width:100%;margin:8px 0}textarea{width:100%;box-sizing:border-box}label{display:block}button{padding:10px}</style><h1>比較実験案件</h1><p>非公開の comparison_cases.json を選択。処理は端末内のみ。設計確認後に回答取得用ファイルを作成します。投稿承認ではありません。</p><input type="file" id="file" accept=".json,.txt"><p id="status" role="status"></p><select id="cases" disabled></select><textarea id="prompt" rows="12" readonly></textarea><label><input type="checkbox" id="confirmed" disabled>入力内容と評価基準を確認した（評価基準は元の調査成果物で確認）</label><button id="save" disabled>回答取得用JSONを保存</button><script>
const $=id=>document.getElementById(id);let entries=[];function valid(x){return x&&x.status==='awaiting_design_confirmation'&&x.approved===false&&x.posted===false&&typeof x.prompt==='string'&&x.prompt.length>=30&&x.prompt.length<=12000&&/^[a-f0-9]{64}$/.test(x.case_id)&&Array.isArray(x.responses)&&x.responses.length===0}function reset(){entries=[];$('cases').replaceChildren();$('cases').disabled=true;$('prompt').value='';$('confirmed').checked=false;$('confirmed').disabled=true;$('save').disabled=true}function show(){const x=entries[Number($('cases').value)];$('prompt').value=x?.prompt||'';$('confirmed').checked=false;$('confirmed').disabled=!x;$('save').disabled=true}let version=0;$('file').onchange=async()=>{const v=++version;reset();try{const f=$('file').files[0];if(!f||f.size>2000000)throw Error();const d=JSON.parse(await f.text());if(d.schema!==1||!Array.isArray(d.entries)||d.entries.length>100)throw Error();const good=[];for(const x of d.entries){if(!valid(x))continue;const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x.prompt))),b=>b.toString(16).padStart(2,'0')).join('');if(hash===x.case_id)good.push(x)}if(v!==version)return;entries=good;entries.forEach((x,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=String(x.topic||'比較実験')+' / '+x.source_run_id;$('cases').append(o)});$('cases').disabled=!entries.length;$('status').textContent=entries.length+'件の候補';show()}catch(e){if(v===version){reset();$('status').textContent='読み込み失敗'}}};$('cases').onchange=show;$('confirmed').onchange=()=>{$('save').disabled=!$('confirmed').checked||!entries[Number($('cases').value)]};$('save').onclick=()=>{const x=entries[Number($('cases').value)];if(!x||!$('confirmed').checked)return;const url=URL.createObjectURL(new Blob([JSON.stringify({prompt:x.prompt,responses:[]},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='comparison_input.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>

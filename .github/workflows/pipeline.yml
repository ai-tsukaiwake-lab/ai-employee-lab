name: AI Employee Chain Test

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Experiment topic (public-safe text only)'
        required: true
        default: 'ChatGPTとGeminiの使い分け'
        type: string
      resume_run_id:
        description: 'Optional previous FAILED run ID to resume (digits only); leave empty for a fresh run'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      TOPIC: ${{ inputs.topic }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download previous failed-run artifact (resume only)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ai-chain-result
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: resume_input
      - name: Run chained AI tasks
        run: python scripts/pipeline.py
      - name: Build public status and private bundle
        if: always()
        run: python scripts/build_status.py
      - name: Save results including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chain-result
          path: pipeline_results/
          retention-days: 7
          if-no-files-found: warn
      - name: Publish public metadata only (never drafts)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public AI workflow status"
            git push origin HEAD:main
          fi

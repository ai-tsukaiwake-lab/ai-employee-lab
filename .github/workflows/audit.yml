name: AI Employee Audit Draft Test

on:
  workflow_dispatch:
    inputs:
      draft_text:
        description: 'Paste an actual, unpublished X draft (do not enter secrets)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run advisory audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          DRAFT_TEXT: ${{ inputs.draft_text }}
        run: python scripts/audit.py

      - name: Save audit result
        uses: actions/upload-artifact@v4
        with:
          name: audit-advisory-result
          path: audit_result.json
          retention-days: 7
          if-no-files-found: error

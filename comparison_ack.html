<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>比較実験 確認記録</title><style>body{font:16px system-ui;max-width:600px;margin:24px auto;padding:16px}input,button{font:inherit;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:12px}</style><h1>比較実験 確認記録</h1><p>非公開の comparison_ceo_handoff.json を選択してください。データは端末内で処理します。投稿承認ではありません。</p><input id="f" type="file" accept=".json,.txt"><pre id="info"></pre><label><input id="ok" type="checkbox" disabled>対象の成果物を確認した</label><br><button id="save" disabled>確認済みJSONを保存</button><p>保存後、非公開リポジトリの config にアップロードしてください。既存記録がある場合は上書きせず統合してください。</p><script>let h=null;const f=document.getElementById('f'),info=document.getElementById('info'),ok=document.getElementById('ok'),save=document.getElementById('save');f.onchange=async()=>{h=null;ok.checked=false;ok.disabled=true;save.disabled=true;try{const x=JSON.parse(await f.files[0].text());if(x.status!=='human_review'||x.approved!==false||x.posted!==false||typeof x.case_id!=='string'||! /^[a-f0-9]{64}$/.test(x.case_id)||typeof x.run_id!=='string'||! /^[0-9]{1,20}$/.test(x.run_id))throw Error();h=x;info.textContent='実行ID: '+x.run_id+'\n実験ID: '+x.case_id;ok.disabled=false}catch(e){info.textContent='対象外または不正なファイル'}};ok.onchange=()=>save.disabled=!h||!ok.checked;save.onclick=()=>{if(!h||!ok.checked)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:1,entries:[{case_id:h.case_id,run_id:h.run_id,review_acknowledged:true}]},null,2)],{type:'application/json'}));a.download='comparison_ack.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
